generate_qa: |
  You are an expert in insurance policies, claims, and coverage analysis.
  Your task is to generate 5 diverse, high-quality Question-Answer (QA) pairs based on the provided synthetic insurance HTML table.

  **Input Table:**
  {synthetic_html}

  **Requirements:**
  1. **Diversity:** Generate questions of varying types with an insurance focus:
      - **Lookup:** Retrieving specific coverage limits, premium amounts, or deductibles (e.g., "What is the deductible for Plan A?").
      - **Comparison:** Comparing benefits between different plans or rider options (e.g., "Which plan offers higher accidental death coverage?").
      - **Calculation:** Calculating potential claim payouts or annual premiums (e.g., "If the insured is hospitalized for 5 days, what is the total benefit amount?").
      - **Reasoning:** Inferring eligibility or coverage scope (e.g., "Is dental treatment covered under the Basic plan?").
  2. **Format:** Output the result as a JSON object with a key "qa_pairs", which is a list of objects containing "question", "answer", and "type".
  3. **Language:** The questions and answers MUST be in Korean.
  4. **Reasoning Language:** reasoning_annotation MUST be written in English and MUST be a single string (not a list).
  5. **Accuracy:** Ensure all answers are factually correct based on the data in the table.
  7. **Context:** Include the specific table cells or rows that were used to answer the question.

  **Output Format (JSON):**
  {{
      "qa_pairs": [
          {{
              "question": "...",
              "answer": "...",
              "type": "lookup",
              "reasoning_annotation": "Detailed explanation of how the answer was derived (in English, single string)",
              "context": "Specific table cells/rows used (e.g., 'Row 2, Column 3: Premium amount')"
          }},
          ...
      ]
  }}

generate_qa_from_image: |
  You are an expert in insurance policies, claims, and coverage analysis.
  Your task is to analyze the insurance table image and generate 5 diverse, high-quality QA pairs.

  **Requirements:**
  1. **Table Analysis:** Interpret insurance terminology (Premium, Deductible, Co-pay, Rider, Exclusions).
  2. **Diversity:** Generate questions of varying types:
      - **Lookup:** Retrieving specific coverage limits, premium amounts, or deductibles.
      - **Comparison:** Comparing benefits between different plans or rider options.
      - **Calculation:** Calculating potential claim payouts or annual premiums.
      - **Reasoning:** Inferring eligibility or coverage scope/exclusions.
  3. **Format:** Output the result as a JSON object with a key "qa_pairs", which is a list of objects containing "question", "answer", and "type".
  4. **Language:** The questions and answers MUST be in Korean.
  5. **Reasoning Language:** reasoning_annotation MUST be written in English and MUST be a single string (not a list).
  6. **Accuracy:** Ensure 100% factual correctness.
  7. **Context:** Include specific cell references or table sections used to derive the answer.

  **Output Format (JSON):**
  {{
      "qa_pairs": [
          {{
              "question": "...",
              "answer": "...",
              "type": "lookup",
              "reasoning_annotation": "Step-by-step reasoning process in English (single string)",
              "context": "Table location used (e.g., 'Premium column, Row 3')"
          }},
          ...
      ]
  }}
  Return ONLY the JSON object.

generate_synthetic_table: |
  You are a Synthetic Data Generator specializing in Insurance Data.

  **⚠️ CRITICAL INSTRUCTION: DO NOT COPY ORIGINAL DATA ⚠️**
  Your task is to generate a new HTML table with the SAME STRUCTURE as the original but COMPLETELY DIFFERENT insurance data values.

  **Inputs:**
  1. **Original Table Structure (for structure reference ONLY - DO NOT copy the data values):**
  {html}

  2. **Table Summary (describes the data patterns to follow):**
  {summary}

  **Requirements:**
  1. **Structure:** Keep the exact same HTML structure (rows, columns, headers, merges, rowspan, colspan).
  2. **Headers:** Keep header text the same (column names, category labels).
  3. **⚠️ Data Transformation - ABSOLUTELY MANDATORY ⚠️:**
     - **ALL data cell values MUST be replaced with completely new synthetic values.**
     - **NEVER copy any original data values** - generate fresh, realistic alternatives.
     - For plan names: Generate DIFFERENT insurance plan names
     - For coverage amounts: Generate DIFFERENT amounts
     - For premiums: Generate DIFFERENT premium amounts
     - For terms/conditions: Generate DIFFERENT coverage terms
     - For dates: Generate DIFFERENT plausible dates
  4. **Styling:** Use **Tailwind CSS** classes (NO inline styles). **Observe and mimic the original image's visual style:**
      - Look at the original image's color scheme and design
      - Use appropriate Tailwind color classes to match the original style
      - Basic structure: `<table class="w-full border-collapse text-sm">`
      - Headers/cells: Include `border`, `px-4 py-3`, appropriate colors
      - Lists: `class="list-disc ml-5 space-y-1"`
      - **DO NOT use inline style attributes**
  5. **Domain Consistency:** Ensure insurance logic (higher premiums for better coverage)
  6. **Output:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`. No markdown code blocks.

  **Example Transformation (Generic):**
  - Original plan: "보험A" → Synthetic: "보험B"
  - Original coverage: "1억원" → Synthetic: "5천만원"
  - Original premium: "월 3만원" → Synthetic: "월 5만원"

  ⚠️ If the generated content is identical or very similar to the original, the output is INVALID.

generate_synthetic_table_from_image: |
  You are a Synthetic Data Generator specializing in Insurance Data.

  **⚠️ CRITICAL INSTRUCTION: DO NOT TRANSCRIBE - GENERATE NEW DATA ⚠️**
  Your task is NOT to OCR/transcribe the image. Instead, you must:
  1. Understand the table's STRUCTURE from the image
  2. Understand it's an INSURANCE table
  3. Generate COMPLETELY NEW synthetic insurance data that fits the domain but uses ENTIRELY DIFFERENT values

  **Inputs:**
  1. **Image:** An image of an insurance table. Use this to understand structure and domain ONLY.

  **Requirements:**
  1. **Structure Preservation:** Accurately reconstruct the table structure, including rowspan/colspan.
  2. **Headers:** Keep header text the same as in the image.
  3. **⚠️ Data Generation - ABSOLUTELY CRITICAL ⚠️:**
     - **NEVER copy the data values from the image** - this is NOT an OCR task
     - **ALL cell content must be completely NEW and DIFFERENT**
     - For plan names: Generate DIFFERENT insurance plan names
     - For coverage/premiums: Generate DIFFERENT amounts
     - For terms: Generate DIFFERENT coverage terms
  4. **Styling:** Use **Tailwind CSS** classes exclusively (NO inline styles).
      - `<table>`: `class="w-full border-collapse text-sm"`
      - `<thead>`: `class="bg-gradient-to-r from-amber-600 to-amber-700 text-white"`
      - `<th>`: `class="border border-amber-300 px-4 py-3 font-semibold text-left"`
      - `<tbody>`: `class="divide-y divide-slate-200"`
      - `<tr>` (body rows): `class="hover:bg-amber-50 transition-colors"`
      - `<td>`: `class="border border-slate-200 px-4 py-3 text-slate-700"`
      - `<ul>`: `class="list-disc ml-5 space-y-1 text-slate-600"`
      - **DO NOT use inline style attributes**
  5. **Output Format:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`. No markdown code blocks.

  **Example (Generic):**
  - Plan name in image: "보험X" → Generate: "보험Y"
  - Amount in image: "금액A" → Generate: "금액B"

  ⚠️ If the generated content is identical or very similar to the image, the output is INVALID.
