generate_qa: |
  You are an 'AI Data Researcher' specialized in building high-quality QA datasets based on business and corporate data.
  Your mission is to analyze the provided business table data (HTML) and generate Question-Answer (QA) pairs that fit the specified Reasoning Type definitions.

  **Input Table:**
  {synthetic_html}

  ### [Instructions]
  1. **Candidate Generation & Filtering**: Internally generate 9 diverse QA pairs first. Then, for each Reasoning Type, select and output only the single most perfect QA pair that passes the [Validation Criteria]. (Total 9 pairs)
  2. **Domain Suitability**: Questions must maintain a business tone and accurately handle revenue, profit margins, growth rates, market share, and employee performance metrics.
  3. **Strict Constraints**:
     - Answers must be derived ONLY from the table (and provided context). No external knowledge.
     - Each QA pair must correspond to exactly one Reasoning Type.
     - Output format must strictly follow JSON.
     - Questions and Answers MUST be written in Korean.
     - reasoning_annotation MUST be written in English and MUST be a single string (not a list).
     - **DO NOT use real company names** (e.g., Samsung, Apple, Google). Use fictional names like "A사", "B기업", "가나다 주식회사".

  ### [Validation Criteria]
  - Is the answer uniquely determined within the table?
  - Is the reasoning process (Annotation) logically flawless?
  - Is the question clear and unambiguous? (e.g., "Best performance" -> "Branch with highest Revenue")

  ### [Answer Format Guidelines - CRITICAL FOR EVALUATION]
  ⚠️ **Answers MUST be SHORT and CONCISE (단답형)** ⚠️
  - **DO NOT include reasoning or explanation in the answer** - put those in reasoning_annotation only
  - **Numeric answers**: Just the number with unit (e.g., "150억원", "23.5%", "3개")
  - **Yes/No questions**: "예" or "아니오" only
  - **Entity answers**: Just the name (e.g., "마케팅팀", "A사", "김철수")
  - **List answers**: Comma-separated items only (e.g., "A팀, B팀, C팀")
  - **Comparison answers**: Just the winner/result (e.g., "영업팀", "2023년")
  - **Maximum answer length: 50 characters**
  - ❌ BAD: "총 6개입니다. 차별화 요소에 3개, 경쟁 우위에 3개가 있습니다."
  - ✅ GOOD: "6개"
  - ❌ BAD: "경쟁 우위가 비용 효율화를 더 구체적으로 다루고 있습니다. 왜냐하면..."
  - ✅ GOOD: "경쟁 우위"

  ### [Reasoning Type Definitions (Business Domain)]
  (1) lookup: Retrieve specific performance values of departments or products without condition/calculation. (e.g., "What is the Q1 Revenue of Branch A?")
  (2) filter: Select rows/columns meeting specific conditions (goals met, budget range). (e.g., "List all products with operating margin over 20%.")
  (3) aggregate: Statistical aggregation of performance data (Sum, Avg, Max, Min). (e.g., "What is the total annual revenue of all branches?")
  (4) compare: Compare performance YoY or between competitors/departments. (e.g., "Did marketing budget increase compared to last year?")
  (5) arithmetic: Specific calculation beyond simple comparison (growth rate, profit difference). (e.g., "What is the sales volume difference between Product A and Product B?")
  (6) temporal: Identify quarterly/yearly trends. (e.g., "Which department showed continuous revenue growth over the last 3 years?")
  (7) multi_hop: Multi-step inference finding a value first, then using it as a key. (e.g., "What is the name of the Branch Manager of the branch with the #1 Revenue?")
  (8) implicit_reference: Referring to specific metrics contextually without explicit column name. (e.g., "Which is the most profitable project?" -> implies Profit Margin column)
  (9) ellipsis: Recovering omitted comparisons or criteria from table structure. (e.g., "What is Q4 performance?" -> implies continuation from Q1-Q3 context)

  ### [Output Format (JSON)]
  {{
    "qa_pairs": [
      {{
        "question": "Question text",
        "answer": "Short answer only (max 50 chars, no explanation)",
        "type": "lookup",
        "reasoning_annotation": "Step-by-step logic to derive answer (MUST be a string, not a list)",
        "context": null
      }},
      ... (One per Reasoning Type => Total 9)
    ]
  }}

