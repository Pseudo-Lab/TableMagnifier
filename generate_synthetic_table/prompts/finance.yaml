generate_qa_from_multi_image: |
  You are an 'AI Data Researcher' specialized in building high-quality QA datasets that require understanding MULTIPLE financial table images together.
  Your mission is to analyze ALL provided financial table images and generate Question-Answer (QA) pairs that REQUIRE information from MULTIPLE images to answer.

  **⚠️ CRITICAL REQUIREMENT: CROSS-IMAGE REASONING ⚠️**
  - Every QA pair MUST require information from AT LEAST TWO images to answer correctly.
  - Questions answerable from a single image are INVALID.
  - Focus on comparisons, aggregations, or inferences that span multiple financial statements or reports.

  ### [Instructions]
  1. **Analyze All Images**: First, understand what data each image contains and how they relate (e.g., different fiscal periods, income statement vs balance sheet, different securities).
  2. **Generate Cross-Image QA**: Create 9 diverse QA pairs where each question requires synthesizing information from multiple images.
  3. **Strict Constraints**:
     - Answers must be derived from combining data across images. No external knowledge.
     - Each QA pair must correspond to exactly one Reasoning Type.
     - Output format must strictly follow JSON.
     - Questions and Answers MUST be written in Korean.
     - reasoning_annotation MUST be written in English, MUST be a single string, and MUST specify which images were used.
     - **DO NOT use real company/financial institution/fund names** (e.g., Samsung, Apple, Vanguard, 국민은행, 신한은행, 하나은행, 우리은행, 삼성생명, 한화생명, 삼성화재, 현대해상, DB손해보험, 메리츠화재, KB손해보험, 삼성증권, 미래에셋). Use fictional names like "A사", "B은행", "C펀드", "가나다증권", "라마바생명".

  ### [Validation Criteria]
  - Does the answer REQUIRE data from multiple images? (Single-image answers are INVALID)
  - Is the reasoning process logically flawless?
  - Is the question clear about what is being compared or combined?

  ### [Answer Format Guidelines - CRITICAL FOR EVALUATION]
  ⚠️ **Answers MUST be SHORT and CONCISE (단답형)** ⚠️
  - **DO NOT include reasoning or explanation in the answer** - put those in reasoning_annotation only
  - **Numeric answers**: Just the number with unit (e.g., "150억원", "23.5%")
  - **Entity answers**: Just the name (e.g., "A사", "Table 1")
  - **Maximum answer length: 50 characters**

  ### [Cross-Image Reasoning Type Definitions (Finance Domain)]
  (1) cross_lookup: Retrieve and combine specific financial values from different statements. (e.g., "What is the total assets combining both Q1 and Q2 balance sheets?")
  (2) cross_filter: Filter entries across financial statements based on conditions. (e.g., "Which accounts show positive growth in both the income statement and cash flow statement?")
  (3) cross_aggregate: Aggregate financial data spanning multiple periods or statements. (e.g., "What is the total revenue across all quarterly reports shown?")
  (4) cross_compare: Compare financial ratios or metrics between different periods or portfolios. (e.g., "Did the debt-to-equity ratio improve from Table 1 to Table 2?")
  (5) cross_arithmetic: Calculate financial metrics using data from multiple statements. (e.g., "Calculate the year-over-year revenue growth using data from both annual reports.")
  (6) cross_temporal: Identify financial trends by combining multiple period data. (e.g., "Based on all quarterly statements, what is the profit margin trend?")
  (7) cross_multi_hop: Multi-step financial inference across statements. (e.g., "Find the highest dividend stock in Image 1, then find its P/E ratio in Image 2.")
  (8) cross_implicit: Answer questions requiring understanding relationships between financial statements. (e.g., "Which company is more leveraged?" requires comparing debt from multiple sources)
  (9) cross_synthesis: Synthesize financial insights only possible by viewing all statements together. (e.g., "Based on both income and cash flow statements, which segments are cash-generative?")

  ### [Output Format (JSON)]
  {{
    "qa_pairs": [
      {{
        "question": "Question requiring multiple financial images to answer",
        "answer": "Short answer only (max 50 chars)",
        "type": "cross_lookup",
        "reasoning_annotation": "Step 1: From Image 1, extract X. Step 2: From Image 2, extract Y. Step 3: Combine to get answer.",
        "context": null,
        "images_used": ["image_1", "image_2"]
      }},
      ... (One per Reasoning Type => Total 9)
    ]
  }}
  Return ONLY the JSON object.

generate_synthetic_table: |
  You are a Synthetic Data Generator specializing in Financial Data.

  **⚠️ CRITICAL INSTRUCTION: DO NOT COPY ORIGINAL DATA ⚠️**
  Your task is to generate a new HTML table with the SAME STRUCTURE as the original but COMPLETELY DIFFERENT financial data values.

  **Inputs:**
  1. **Original Table Structure (for structure reference ONLY - DO NOT copy the data values):**
  {html}

  2. **Table Summary (describes the data patterns to follow):**
  {summary}

  **Requirements:**
  1. **Structure:** Keep the exact same HTML structure (rows, columns, headers, merges, rowspan, colspan).
  2. **Headers:** Keep header text the same (column names, category labels).
  3. **⚠️ Data Transformation - ABSOLUTELY MANDATORY ⚠️:**
     - **ALL data cell values MUST be replaced with completely new synthetic values.**
     - **NEVER copy any original data values** - generate fresh, realistic alternatives.
     - **NEVER use real company/financial institution names** (Samsung, Apple, Google, 현대, SK, LG, 국민은행, 신한은행, 하나은행, 우리은행, 삼성생명, 한화생명, 삼성화재, 현대해상, DB손해보험, 메리츠화재, KB손해보험, 삼성증권, 미래에셋증권, NH투자증권, etc.). Use fictional names like "A사", "B은행", "가나다증권", "라마바생명".
     - For company/institution names: Generate DIFFERENT fictional names (e.g., "A회사" → "B회사", "가나다은행" → "라마바은행")
     - For financial figures: Generate DIFFERENT amounts (similar magnitude, different values)
     - For percentages/ratios: Generate DIFFERENT metrics
     - For dates: Generate DIFFERENT plausible dates
  4. **Styling:** Use **Tailwind CSS** classes (NO inline styles). **Observe and mimic the original image's visual style:**
      - Look at the original image's color scheme and design
      - Use appropriate Tailwind color classes to match the original style
      - Basic structure: `<table class="w-full border-collapse text-sm">`
      - Headers/cells: Include `border`, `px-4 py-3`, appropriate colors
      - Lists: `class="list-disc ml-5 space-y-1"`
      - **DO NOT use inline style attributes**
  5. **Domain Consistency:** Ensure financial logic (Assets = Liabilities + Equity, Totals match)
  6. **Output:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`. No markdown code blocks.

  **Example Transformation (Generic):**
  - Original company: "A기업" → Synthetic: "B기업"
  - Original amount: "100억원" → Synthetic: "150억원"
  - Original ratio: "PER 10" → Synthetic: "PER 8"

  ⚠️ If the generated content is identical or very similar to the original, the output is INVALID.

generate_synthetic_table_from_image: |
  You are a Synthetic Data Generator specializing in Financial Data.

  **⚠️ CRITICAL INSTRUCTION: DO NOT TRANSCRIBE - GENERATE NEW DATA ⚠️**
  Your task is NOT to OCR/transcribe the image. Instead, you must:
  1. Understand the table's STRUCTURE from the image
  2. Understand it's a FINANCIAL table
  3. Generate COMPLETELY NEW synthetic financial data that fits the domain but uses ENTIRELY DIFFERENT values

  **Inputs:**
  1. **Image:** An image of a financial table. Use this to understand structure and domain ONLY.

  **Requirements:**
  1. **Structure Preservation:** Accurately reconstruct the table structure, including rowspan/colspan.
  2. **Headers:** Keep header text the same as in the image.
  3. **⚠️ Data Generation - ABSOLUTELY CRITICAL ⚠️:**
     - **NEVER copy the data values from the image** - this is NOT an OCR task
     - **ALL cell content must be completely NEW and DIFFERENT**
     - **NEVER use real company/financial institution names** (Samsung, Apple, Google, 현대, SK, LG, 국민은행, 신한은행, 하나은행, 우리은행, 삼성생명, 한화생명, 삼성화재, 현대해상, DB손해보험, 메리츠화재, KB손해보험, 삼성증권, 미래에셋증권, NH투자증권, etc.). Use fictional names like "A사", "B은행", "가나다증권", "라마바생명".
     - For company/institution names: Generate DIFFERENT fictional names
     - For financial figures: Generate DIFFERENT amounts
     - For percentages/ratios: Generate DIFFERENT metrics
  4. **Styling:** Use **Tailwind CSS** classes exclusively (NO inline styles).
      - `<table>`: `class="w-full border-collapse text-sm"`
      - `<thead>`: `class="bg-gradient-to-r from-green-700 to-green-800 text-white"`
      - `<th>`: `class="border border-green-300 px-4 py-3 font-semibold text-left"`
      - `<tbody>`: `class="divide-y divide-slate-200"`
      - `<tr>` (body rows): `class="hover:bg-green-50 transition-colors"`
      - `<td>`: `class="border border-slate-200 px-4 py-3 text-slate-700"`
      - `<ul>`: `class="list-disc ml-5 space-y-1 text-slate-600"`
      - **DO NOT use inline style attributes**
  5. **Output Format:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`. No markdown code blocks.

  **Example (Generic):**
  - Company in image: "X회사" → Generate: "Y회사"
  - Amount in image: "50억" → Generate: "80억"

  ⚠️ If the generated content is identical or very similar to the image, the output is INVALID.

generate_long_sequence: |
  You are an 'AI Data Researcher' specialized in creating context-dependent QA pairs for financial tables.
  Your mission is to generate a single high-quality "long_sequence" type QA pair that requires interpreting external context to answer questions about the table.

  **Input Table:**
  {synthetic_html}

  ### [Instructions]
  1. **Generate ONE long_sequence QA pair** that requires reading and understanding a context paragraph to filter or interpret the table data.
  2. **Create a realistic financial context** (e.g., "Market Outlook", "Investment Strategy", "Risk Guidelines") that provides information needed to answer the question.
  3. **The question must be unanswerable without the context** - the context should contain key criteria or conditions.
  4. **Strict Constraints**:
     - Answer must be derived from BOTH the table AND the embedded context in the question. Neither alone is sufficient.
     - Questions and Answers MUST be written in Korean.
     - reasoning_annotation MUST be written in English and MUST be a single string.
     - **DO NOT use real company/financial institution names** (e.g., Samsung, Apple, Google, 국민은행, 신한은행, 하나은행, 우리은행, 삼성생명, 한화생명, 삼성화재, 현대해상, DB손해보험, 메리츠화재, KB손해보험, 삼성증권, 미래에셋). Use fictional names like "A사", "B은행", "가나다증권", "라마바생명".
     - **context field should be null** - all context should be embedded within the question itself.
  5. **Answer Format (단답형)**:
     - Answers MUST be SHORT and CONCISE (max 50 characters)
     - DO NOT include reasoning in the answer - put those in reasoning_annotation
     - ❌ BAD: "조건을 충족하는 종목은 A사와 B사입니다."
     - ✅ GOOD: "A사"
  6. **⚠️ Question Length - CRITICAL ⚠️**:
     - **Question MUST be at least 500 characters long (minimum 500자)**
     - Create a realistic investment/financial scenario with specific situation, constraints, and requirements
     - The question should ask to SELECT ONE specific item that best fits the given scenario
     - ❌ BAD: Questions asking to count items or list multiple answers
     - ✅ GOOD: Questions asking "which ONE stock/fund best fits this scenario?"

  ### [Example Scenarios (Finance) - SELECT ONE ITEM]
  - Market downturn scenario: "시장 급락 상황에서 포트폴리오 방어를 위해 가장 먼저 매도해야 할 종목은?"
  - Investment mandate: "보수적 투자 성향의 고객에게 추천할 가장 적합한 상품은?"
  - Risk management: "리스크 한도를 초과했을 때, 가장 먼저 축소해야 할 포지션은?"
  - Regulatory compliance: "새로운 규제 요건을 충족하기 위해 조정해야 할 항목은?"

  ### [Output Format (JSON)]
  {{
    "qa_pairs": [
      {{
        "question": "(MINIMUM 500자) 예시: 자산운용사 A펀드는 최근 글로벌 금리 인상과 경기 침체 우려로 인해 포트폴리오 리밸런싱을 검토하고 있다. 리스크관리팀은 현재 포트폴리오의 변동성이 내부 기준치를 초과하였으며, 방어적 자산 비중을 높여야 한다고 보고하였다. CIO는 유동성을 확보하면서도 장기 수익률 목표를 훼손하지 않는 방향으로 조정이 필요하다고 지시하였다. 추가로 내부 규정상 단일 종목 비중이 15%를 초과하는 경우 우선 매도 대상이 된다. 현재 보유 종목 중에서 비중 규정을 위반하면서 변동성이 가장 높아 즉시 매도가 필요한 종목을 찾아 답하시오.",
        "answer": "해당 종목명 (max 50 chars)",
        "type": "long_sequence",
        "reasoning_annotation": "Step 1: Identify constraints from scenario (weight limit, high volatility). Step 2: Filter stocks exceeding 15% weight. Step 3: Compare volatility among filtered stocks. Step 4: Select the ONE stock that needs immediate sale.",
        "context": null
      }}
    ]
  }}
  Return ONLY the JSON object.
