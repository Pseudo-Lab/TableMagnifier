
generate_qa: |
  You are an expert in creating educational and reasoning questions from tabular data.
  Your task is to generate 5 diverse Question-Answer (QA) pairs based on the provided HTML table.

  **Input Table:**
  {synthetic_html}

  **Requirements:**
  1. **Diversity:** Generate questions of varying types:
      - **Lookup:** Retrieving a specific value (e.g., "What is the price of item X?").
      - **Comparison:** Comparing two or more values (e.g., "Which team has the highest score?").
      - **Calculation:** Performing simple arithmetic (e.g., "What is the total of A and B?", "What is the difference between X and Y?").
      - **Reasoning:** Inferring information based on the data.
  2. **Format:** Output the result as a JSON object with a key "qa_pairs", which is a list of objects containing "question", "answer", and "type".
  3. **Language:** The questions and answers should be in Korean (since the table is likely Korean).
  4. **Reasoning Language:** reasoning_annotation MUST be written in English and MUST be a single string (not a list).

  **Output Format (JSON):**
  {{
      "qa_pairs": [
          {{
              "question": "...",
              "answer": "...",
              "type": "lookup"
          }},
          ...
      ]
  }}

generate_qa_from_image: |
  You are an expert in creating educational and reasoning questions from tabular data.
  Your task is to analyze the table image provided and generate 5 diverse Question-Answer (QA) pairs.

  **Requirements:**
  1. **Table Analysis:** First, carefully analyze the table structure, headers, and data values in the image.
  2. **Diversity:** Generate questions of varying types:
      - **Lookup:** Retrieving a specific value (e.g., "What is the price of item X?").
      - **Comparison:** Comparing two or more values (e.g., "Which team has the highest score?").
      - **Calculation:** Performing simple arithmetic (e.g., "What is the total of A and B?", "What is the difference between X and Y?").
      - **Reasoning:** Inferring information based on the data.
  3. **Format:** Output the result as a JSON object with a key "qa_pairs", which is a list of objects containing "question", "answer", and "type".
  4. **Language:** The questions and answers MUST be in Korean (since the table is likely Korean).
  5. **Reasoning Language:** reasoning_annotation MUST be written in English and MUST be a single string (not a list).
  6. **Accuracy:** Ensure all answers are factually correct based on the data visible in the image.

  **Output Format (JSON):**
  {{
      "qa_pairs": [
          {{
              "question": "...",
              "answer": "...",
              "type": "lookup"
          }},
          {{
              "question": "...",
              "answer": "...",
              "type": "comparison"
          }},
          {{
              "question": "...",
              "answer": "...",
              "type": "calculation"
          }},
          {{
              "question": "...",
              "answer": "...",
              "type": "reasoning"
          }},
          {{
              "question": "...",
              "answer": "...",
              "type": "lookup"
          }}
      ]
  }}

  Return ONLY the JSON object, no additional text.

generate_synthetic_table: |
  You are a Synthetic Data Generator specialized in creating completely NEW data while preserving table structure.

  **CRITICAL INSTRUCTION: DO NOT COPY ORIGINAL DATA**
  Your task is to generate a new HTML table that has the SAME STRUCTURE as the original but with COMPLETELY DIFFERENT, newly generated data values.
  The goal is to create realistic synthetic data that looks like it could come from the same domain, but with entirely different entities, names, numbers, and values.

  **Inputs:**
  1. **Original Table Structure (for structure reference ONLY - DO NOT copy the data values):**
  {html}

  2. **Table Summary (describes the data patterns to follow):**
  {summary}

  **Requirements:**
  1. **Structure:** Keep the exact same HTML structure (rows, columns, headers, rowspan, colspan, merges) as the original.
  2. **Headers:** Keep header text the same (column names, row labels that describe categories).
  3. **Data Transformation - MANDATORY:**
     - **ALL data cell values MUST be replaced with completely new synthetic values.**
     - **DO NOT copy any original data values** - generate fresh, realistic alternatives.
     - For names: Generate new Korean names (e.g., 김철수 → 이영희, 박민수 → 정하늘)
     - For organizations: Generate new realistic Korean organization names
     - For numbers: Generate new realistic numbers that follow the same pattern/range but are different values
     - For dates: Generate new plausible dates
     - For addresses: Generate new realistic Korean addresses
     - For any other text: Generate semantically similar but different content
  4. **Domain Consistency:**
     - Analyze the summary to understand the domain context (finance, medical, public, etc.)
     - Generate data that is realistic for that specific domain
     - Maintain internal consistency (e.g., totals should sum correctly, percentages should add up)
  5. **Output:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`. No markdown code blocks.

  **Example Transformation (showing the expected behavior):**
  - Original: "삼성전자" → Synthetic: "한국테크"
  - Original: "1,500,000" → Synthetic: "2,340,000"
  - Original: "2024-01-15" → Synthetic: "2024-03-22"
  - Original: "서울시 강남구" → Synthetic: "부산시 해운대구"

  Remember: The synthetic table should look like a completely different dataset from the same domain, not a copy of the original.

generate_synthetic_table_from_image: |
  You are a Synthetic Data Generator specialized in creating completely NEW data from Korean document images.

  **CRITICAL INSTRUCTION: DO NOT TRANSCRIBE - GENERATE NEW DATA**
  Your task is NOT to OCR/transcribe the image. Instead, you must:
  1. Understand the table's STRUCTURE from the image
  2. Understand the DOMAIN and data patterns from the image
  3. Generate COMPLETELY NEW synthetic data that fits the same domain but uses different values

  **Inputs:**
  1. **Image:** An image of a table containing Korean text. Use this to understand structure and domain ONLY.

  **Requirements:**
  1. **Structure Preservation:** Accurately reconstruct the table structure, including `rowspan` and `colspan` attributes for merged cells.
  2. **Headers:** Keep header text (column names, category labels) the same as in the image.
  3. **Data Generation - CRITICAL:**
     - **DO NOT copy the data values from the image** - this is NOT an OCR task
     - Generate COMPLETELY NEW synthetic values for all data cells
     - Analyze the domain from the image (finance, medical, public, etc.) and generate appropriate data
     - For names: Generate new Korean names different from what you see
     - For organizations: Generate new realistic Korean organization names
     - For numbers: Generate new realistic numbers in similar ranges but different values
     - For dates: Generate new plausible dates
     - For addresses: Generate new realistic Korean addresses
     - The synthetic table should look like a DIFFERENT dataset from the same domain
  4. **Styling:** Use **Tailwind CSS** classes to style the table.
      - Add `class="border-collapse border border-slate-400 w-full text-sm text-left rtl:text-right text-gray-500"` to the `<table>` tag.
      - Add `class="border border-slate-300 p-2 bg-gray-50 font-semibold"` to `<th>` tags.
      - Add `class="border border-slate-300 p-2"` to `<td>` tags.
  5. **Output Format:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`. No markdown code blocks.

  **Example of Expected Behavior:**
  If the image shows a table with employee "김철수" and salary "3,500,000":
  - WRONG (OCR copy): "김철수", "3,500,000"
  - CORRECT (synthetic): "이영희", "4,200,000"

  Remember: The output should be a new synthetic dataset, not a transcription of the original.

image_to_html: |
  You are an AI assistant specialized in OCR and HTML generation.
  Your task is to convert the provided image of a Korean table into a semantically correct HTML table.

  **Requirements:**
  1. **Structure Preservation:** Accurately reconstruct the table structure, including `rowspan` and `colspan` attributes for merged cells.
  2. **Text Fidelity:** Transcribe the text within the cells exactly as it appears in the image, preserving the Korean language.
  3. **Output Format:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`. Do not include markdown code blocks (```html ... ```) or any other text.
  4. **Styling:** Use **Tailwind CSS** classes to style the table.
      - Add `class="border-collapse border border-slate-400 w-full text-sm text-left rtl:text-right text-gray-500"` to the `<table>` tag.
      - Add `class="border border-slate-300 p-2 bg-gray-50 font-semibold"` to `<th>` tags.
      - Add `class="border border-slate-300 p-2"` to `<td>` tags.
      - Ensure the design looks clean and professional, similar to a standard document table.

parse_contents: |
  Analyze the following HTML table and summarize its schema and content patterns.

  **HTML Table:**
  {html}

  **Instructions:**
  1. Identify the key columns and their hierarchical structure if headers are nested.
  2. For each column, describe the data type (e.g., text, integer, float, date, currency) and any specific patterns (e.g., "YYYY-MM-DD", "KRW 1,000", "Name (Team)").
  3. Note any constraints or relationships between columns (e.g., "Total = A + B").
  4. Provide a concise summary that can be used to generate realistic synthetic data matching this table's style and structure.

parse_synthetic_table: |
  You are a Data Parser.
  Convert the following HTML table into a structured JSON object.

  **HTML Table:**
  {synthetic_html}

  **Requirements:**
  1. Extract the data into a list of objects, where each object represents a row.
  2. Use the table headers as keys. If headers are nested, flatten them intelligently (e.g., "Category_Subcategory").
  3. Convert numeric values to numbers (int/float) in the JSON.
  4. Output ONLY the valid JSON string. Do not include markdown code blocks.

revise_synthetic_table: |
  You are an expert data editor.
  Your goal is to fix the synthetic table based on the QA feedback.

  [Original HTML Structure]
  {html}

  [Table Summary]
  {summary}

  [Current Synthetic Table]
  {synthetic_html}

  [QA Feedback & Instructions]
  {revision_instructions}

  Please generate the corrected HTML table. Output ONLY the <table>...</table> string.

revise_synthetic_table_from_image: |
  You are an expert data editor.
  Your goal is to fix the synthetic table based on the QA feedback and the original image.

  **Inputs:**
  1. **Image:** The original table image.
  2. **Current Synthetic Table:**
  {synthetic_html}

  3. **QA Feedback & Instructions:**
  {revision_instructions}

  **Requirements:**
  1. **Fix Errors:** Address the specific issues raised in the feedback.
  2. **Reference Image:** Use the original image to verify structure or context if needed, but remember the goal is *synthetic* data, not transcription (unless the error is about structure).
  3. **Output:** Return ONLY the corrected raw HTML string starting with `<table>` and ending with `</table>`.

self_reflection: |
  You are a strict QA reviewer for synthetic HTML tables.

  Check:
  1) table structure matches original HTML
  2) column count / header hierarchy
  3) row consistency
  4) cell type realism (numbers vs text)
  5) validity of HTML tags
  6) no missing/extra columns

  Output ONLY valid JSON with this schema:

  {{
    "passed": true/false,
    "score": 0-100,
    "issues": [
      {{"type": "structure|header|row_count|data_type|html_validity|other",
       "detail": "..."}}
    ],
    "revision_instructions": "Concrete step-by-step instructions to fix the table."
  }}

  DO NOT include any other text.
  Original HTML:
  {html}

  Synthetic HTML:
  {synthetic_html}

self_reflection_from_image: |
  You are a strict QA reviewer for synthetic HTML tables.

  Check:
  1) table structure matches the original table in the image
  2) column count / header hierarchy
  3) row consistency
  4) cell type realism (numbers vs text)
  5) validity of HTML tags
  6) no missing/extra columns

  Output ONLY valid JSON with this schema:

  {{
    "passed": true/false,
    "score": 0-100,
    "issues": [
      {{"type": "structure|header|row_count|data_type|html_validity|other",
       "detail": "..."}}
    ],
    "revision_instructions": "Concrete step-by-step instructions to fix the table."
  }}

  DO NOT include any other text.
  Synthetic HTML:
