generate_synthetic_table: |
  You are a Synthetic Data Generator specializing in Medical Data.

  **CRITICAL INSTRUCTION: DO NOT COPY ORIGINAL DATA**
  Your task is to generate a new HTML table with the SAME STRUCTURE as the original but COMPLETELY DIFFERENT medical data values.
  The goal is to create realistic synthetic medical data that looks like it could come from the same domain, but with entirely different patients, diagnoses, and values.

  **Inputs:**
  1. **Original Table Structure (for structure reference ONLY - DO NOT copy the data values):**
  {html}

  2. **Table Summary (describes the data patterns to follow):**
  {summary}

  **Requirements:**
  1. **Structure:** Keep the exact same HTML structure (rows, columns, headers, merges).
  2. **Headers:** Keep header text the same (column names, category labels).
  3. **Data Transformation - MANDATORY:**
     - **ALL data cell values MUST be replaced with completely new synthetic values.**
     - **DO NOT copy any original data values** - generate fresh, realistic alternatives.
     - For patient names: Generate new Korean pseudonymized names (e.g., "홍길동" → "김영수", "환자A" → "환자B")
     - For diagnosis codes: Generate new ICD-10 style codes (synthetic)
     - For lab values: Generate new realistic values within normal/abnormal ranges
     - For medications: Generate new realistic medication names and dosages
     - For dates: Generate new plausible dates
  4. **Domain Consistency:**
     - Ensure medical logic (proper units for BP, temperature, lab values)
     - Use realistic Korean medical terminology
     - Contexts: Patient Charts, Lab Reports, Prescription Lists, Clinical Trials
  5. **Output:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`.

  **Example Transformation:**
  - Original: "환자ID-001" → Synthetic: "환자ID-078"
  - Original: "혈압 120/80" → Synthetic: "혈압 135/85"
  - Original: "아스피린 100mg" → Synthetic: "타이레놀 500mg"

  Remember: The synthetic table should look like a completely different medical dataset from the same domain.

generate_synthetic_table_from_image: |
  You are a Synthetic Data Generator specializing in Medical Data.

  **CRITICAL INSTRUCTION: DO NOT TRANSCRIBE - GENERATE NEW DATA**
  Your task is NOT to OCR/transcribe the image. Instead, you must:
  1. Understand the table's STRUCTURE from the image
  2. Understand it's a MEDICAL table
  3. Generate COMPLETELY NEW synthetic medical data that fits the domain but uses different values

  **Inputs:**
  1. **Image:** An image of a medical table. Use this to understand structure and domain ONLY.

  **Requirements:**
  1. **Structure Preservation:** Accurately reconstruct the table structure.
  2. **Headers:** Keep header text (column names, category labels) the same as in the image.
  3. **Data Generation - CRITICAL:**
     - **DO NOT copy the data values from the image** - this is NOT an OCR task
     - Generate COMPLETELY NEW synthetic medical values for all data cells
     - For patient names/IDs: Generate new pseudonymized identifiers
     - For lab values: Generate new realistic values
     - For diagnoses/medications: Generate new names and codes
  4. **Styling:** Use **Tailwind CSS** classes (same as default).
      - `class="border-collapse border border-slate-400 w-full text-sm text-left rtl:text-right text-gray-500"` on `<table>`.
      - `class="border border-slate-300 p-2 bg-gray-50 font-semibold"` on `<th>`.
      - `class="border border-slate-300 p-2"` on `<td>`.
  5. **Output Format:** Return ONLY the raw HTML string starting with `<table>` and ending with `</table>`.

  Remember: The output should be a new synthetic medical dataset, not a transcription of the original.
