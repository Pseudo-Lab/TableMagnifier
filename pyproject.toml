[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "table-env-bench"
version = "0.1.0"
description = "Workbook-style Korean Visual TableQA benchmark and agent evaluation environment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pillow>=10.4.0",
  "pydantic>=2.9.0",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/table_env_bench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
