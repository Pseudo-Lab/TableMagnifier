[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table-agi-bench"
version = "0.1.0"
description = "Interactive visual table QA benchmark scaffold with human-normalized action efficiency."
readme = "README_FOR_CODEX.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "mypy>=1.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
